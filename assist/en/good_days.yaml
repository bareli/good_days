# Copy to <config>/custom_sentences/en/good_days.yaml and restart Home Assistant.
language: "en"
intents:
  GoodDaysUpcoming:
    data:
      - sentences:
          - "what's (coming [up]|happening|on) [this|the|next] week"
          - "what is (coming [up]|happening|on) [this|the|next] week"
          - "(any|are there any) (holidays|birthdays|events) this week"
  GoodDaysNextHoliday:
    data:
      - sentences:
          - "when is the next (holiday|chag)"
          - "what is the next (holiday|chag)"
          - "what's the next (holiday|chag)"
  GoodDaysShabbatTimes:
    data:
      - sentences:
          - "when is (candle lighting|shabbat|havdalah)"
          - "when does shabbat (start|begin|end)"
          - "what time is (candle lighting|havdalah)"
  GoodDaysOmer:
    data:
      - sentences:
          - "what('s| is) [the|today's|tonight's] (omer|sefirat haomer) [count]"
          - "what day of the omer is (it|today|tonight)"
  GoodDaysFastTimes:
    data:
      - sentences:
          - "when (is|does) the [next] fast [start|begin|end]"
          - "when does the fast (start|begin|end)"
          - "what time does the fast (start|begin|end)"
