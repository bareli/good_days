blueprint:
  name: Good Days - lights before candle lighting
  description: >-
    Turn lights (or switches) on a few minutes before candle lighting of Shabbat and
    Yom Tov, from calendar.good_days_holidays, and optionally off after havdalah.
  domain: automation
  source_url: https://github.com/bareli/good_days/blob/main/blueprints/automation/good_days/candle_lighting_light.yaml
  input:
    calendar:
      name: Good Days holidays calendar
      default: calendar.good_days_holidays
      selector:
        entity:
          filter:
            - integration: good_days
              domain: calendar
    lights:
      name: Lights
      selector:
        target:
          entity:
            - domain:
                - light
                - switch
                - input_boolean
    minutes_before:
      name: Minutes before candle lighting
      default: 10
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: min
          mode: box
    turn_off_after:
      name: Turn off after havdalah
      default: false
      selector:
        boolean:
    minutes_after:
      name: Minutes after havdalah
      default: 0
      selector:
        number:
          min: 0
          max: 240
          unit_of_measurement: min
          mode: box

mode: queued

trigger_variables:
  cal: !input calendar
  before: !input minutes_before

variables:
  off_after: !input turn_off_after
  after: !input minutes_after

triggers:
  # The calendar's attributes describe the current or next event; Shabbat / Yom Tov are
  # the only timed ones. True from "minutes before" until havdalah, so it fires once.
  # start_time / end_time are naive local strings: as_local() reads them in Home Assistant's
  # time zone (as_timestamp() alone would use the system clock's zone, often UTC in Docker).
  - trigger: template
    id: start
    value_template: >-
      {% set s = state_attr(cal, 'start_time') %}
      {% set e = state_attr(cal, 'end_time') %}
      {{ s is not none and e is not none and not state_attr(cal, 'all_day')
         and now() >= as_local(as_datetime(s)) - timedelta(minutes=before | int)
         and now() < as_local(as_datetime(e)) }}
  - trigger: calendar
    id: end
    event: end
    entity_id: !input calendar

conditions:
  - condition: template
    value_template: >-
      {{ trigger.id == 'start' or (off_after and not trigger.calendar_event.all_day) }}

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: start
        sequence:
          - action: homeassistant.turn_on
            target: !input lights
    default:
      - delay:
          minutes: "{{ after | int }}"
      - action: homeassistant.turn_off
        target: !input lights
