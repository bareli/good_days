blueprint:
  name: Good Days - lights before candle lighting
  description: >-
    Turn lights (or switches) on a few minutes before candle lighting of Shabbat and
    Yom Tov, from sensor.good_days_next_candle_lighting, and optionally off after havdalah.
  domain: automation
  source_url: https://github.com/bareli/good_days/blob/main/blueprints/automation/good_days/candle_lighting_light.yaml
  input:
    sensor:
      name: Good Days next candle lighting sensor
      default: sensor.good_days_next_candle_lighting
      selector:
        entity:
          filter:
            - integration: good_days
              domain: sensor
              device_class: timestamp
    lights:
      name: Lights
      selector:
        target:
          entity:
            - domain:
                - light
                - switch
                - input_boolean
    minutes_before:
      name: Minutes before candle lighting
      default: 10
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: min
          mode: box
    turn_off_after:
      name: Turn off after havdalah
      default: false
      selector:
        boolean:
    minutes_after:
      name: Minutes after havdalah
      default: 0
      selector:
        number:
          min: 0
          max: 240
          unit_of_measurement: min
          mode: box

mode: queued

trigger_variables:
  candle_sensor: !input sensor
  before: !input minutes_before

variables:
  off_after: !input turn_off_after
  after: !input minutes_after

triggers:
  # The sensor holds candle lighting of the current or next Shabbat / Yom Tov (aware
  # timestamp) and its havdalah; true from "minutes before" until havdalah, so it fires once.
  - trigger: template
    id: start
    value_template: >-
      {% set start = as_datetime(states(candle_sensor)) %}
      {% set end = as_datetime(state_attr(candle_sensor, 'havdalah')) %}
      {{ start is not none and end is not none
         and now() >= start - timedelta(minutes=before | int) and now() < end }}
  # in_effect turns false within a minute after havdalah.
  - trigger: state
    id: end
    entity_id: !input sensor
    attribute: in_effect
    from: true
    to: false

conditions:
  - condition: template
    value_template: "{{ trigger.id == 'start' or off_after }}"

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: start
        sequence:
          - action: homeassistant.turn_on
            target: !input lights
    default:
      - delay:
          minutes: "{{ after | int }}"
      - action: homeassistant.turn_off
        target: !input lights
